<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#189B3F" stop-opacity="0.3"/>
      <stop offset="60%" stop-color="#0d1117" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#080a0c" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="strokeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ff66"/>
      <stop offset="50%" stop-color="#189B3F"/>
      <stop offset="100%" stop-color="#0d5222"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Circle -->
  <rect width="600" height="600" rx="300" fill="url(#bgGrad)" />
  
  <!-- Tech Grid Background -->
  <g stroke="#189B3F" stroke-opacity="0.15" stroke-width="1.5">
    <line x1="100" y1="0" x2="100" y2="600" />
    <line x1="200" y1="0" x2="200" y2="600" />
    <line x1="300" y1="0" x2="300" y2="600" />
    <line x1="400" y1="0" x2="400" y2="600" />
    <line x1="500" y1="0" x2="500" y2="600" />
    <line x1="0" y1="100" x2="600" y2="100" />
    <line x1="0" y1="200" x2="600" y2="200" />
    <line x1="0" y1="300" x2="600" y2="300" />
    <line x1="0" y1="400" x2="600" y2="400" />
    <line x1="0" y1="500" x2="600" y2="500" />
  </g>

  <!-- Outer Orbit Rings -->
  <circle cx="300" cy="300" r="270" stroke="url(#strokeGrad)" stroke-width="3" stroke-dasharray="16 8" fill="none" filter="url(#neonGlow)"/>
  <circle cx="300" cy="300" r="240" stroke="#189B3F" stroke-width="1.5" stroke-opacity="0.4" fill="none"/>
  
  <!-- Tech Avatar Graphic Silhouette / Symbol -->
  <g transform="translate(300, 300)">
    <!-- Hexagon Outer Shield -->
    <polygon points="0,-160 138,-80 138,80 0,160 -138,80 -138,-80" fill="#0f161c" stroke="url(#strokeGrad)" stroke-width="4" filter="url(#neonGlow)"/>
    
    <!-- Inner Hexagon -->
    <polygon points="0,-130 112,-65 112,65 0,130 -112,65 -112,-65" fill="none" stroke="#189B3F" stroke-width="2" stroke-opacity="0.5"/>

    <!-- Sagar Meena Initials Tech Typography -->
    <text x="0" y="25" font-family="'Space Grotesk', sans-serif" font-weight="800" font-size="95" fill="#ffffff" text-anchor="middle" letter-spacing="4">
      SM
    </text>

    <!-- Data / Python Node Elements -->
    <circle cx="-138" cy="-80" r="10" fill="#00ff66"/>
    <circle cx="138" cy="-80" r="10" fill="#189B3F"/>
    <circle cx="138" cy="80" r="10" fill="#00ff66"/>
    <circle cx="-138" cy="80" r="10" fill="#189B3F"/>
    <circle cx="0" cy="-160" r="12" fill="#00ff66" filter="url(#neonGlow)"/>
    <circle cx="0" cy="160" r="12" fill="#189B3F"/>
  </g>

  <!-- Label Badge -->
  <rect x="180" y="490" width="240" height="42" rx="21" fill="#0a0e12" stroke="#189B3F" stroke-width="2" />
  <text x="300" y="516" font-family="'Space Grotesk', sans-serif" font-weight="600" font-size="16" fill="#00ff66" text-anchor="middle" letter-spacing="2">
    SAGAR MEENA
  </text>
</svg>
